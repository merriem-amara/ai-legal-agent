[project]
name = "ai-legal-core"
version = "0.1.0"
description = "AI Legal Agent intelligence engine"
requires-python = ">=3.12"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "pymupdf",
    "python-multipart>=0.0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_legal_core"]

[tool.pytest.ini_options]
pythonpath = [
    "src"
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
